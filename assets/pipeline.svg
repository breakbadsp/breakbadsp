<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="Order path: clients, gateway, SPSC queues, pinned matching engines, libvsr replication">
  <title>Order path through modern_exchng_cpp and libvsr</title>
  <style>
    .bg{fill:#0d1117}
    .box{fill:#161b22;stroke:#30363d;stroke-width:1}
    .hot{fill:#0f2a20;stroke:#00e59b;stroke-width:1.25}
    .t{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6edf3}
    .s{font:400 11px -apple-system,"Segoe UI",Helvetica,Arial,"Liberation Sans",sans-serif;fill:#8b949e}
    .h{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#8b949e;letter-spacing:1.4px}
    .leg{font:500 11px -apple-system,"Segoe UI",Helvetica,Arial,"Liberation Sans",sans-serif;fill:#8b949e}
    .slot{fill:#21262d}
    .s0{fill:#00e59b}
    .core{fill:#21262d}
    .c0{fill:#00e59b}
    .ev{fill:#30363d}
    .e0{fill:#00e59b}
    .vs{fill:#00e59b}
    @media (prefers-reduced-motion:no-preference){
      .hot{animation:hot 3.4s ease-in-out infinite}
      .slot{animation:on 1.8s linear infinite}
      .s1{animation-delay:-.3s}.s2{animation-delay:-.6s}.s3{animation-delay:-.9s}
      .s4{animation-delay:-1.2s}.s5{animation-delay:-1.5s}
      .core{animation:on 2.4s linear infinite}
      .c1{animation-delay:-.6s}.c2{animation-delay:-1.2s}.c3{animation-delay:-1.8s}
      .ev{animation:ev 1.8s ease-in-out infinite}
      .e1{animation-delay:-.6s}.e2{animation-delay:-1.2s}
      .vs{animation:pulse 2.2s ease-in-out infinite}
      .ring{animation:ring 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
    }
    @media (prefers-reduced-motion:reduce){
      .smi{display:none}
    }
    @keyframes hot{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
    @keyframes on{0%,16%{fill:#00e59b}30%,100%{fill:#21262d}}
    @keyframes ev{0%,100%{fill:#30363d}40%,60%{fill:#00e59b}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes ring{0%{opacity:.55;transform:scale(.7)}100%{opacity:0;transform:scale(2.1)}}
  </style>
  <defs>
    <linearGradient id="fwd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e59b" stop-opacity="0"/>
      <stop offset=".55" stop-color="#00e59b" stop-opacity=".25"/>
      <stop offset="1" stop-color="#00e59b"/>
    </linearGradient>
    <linearGradient id="back" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#f0b429" stop-opacity="0"/>
      <stop offset=".55" stop-color="#f0b429" stop-opacity=".25"/>
      <stop offset="1" stop-color="#f0b429"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="880" height="220" rx="12"/>
  <text class="h" x="24" y="24">THE HOT PATH I KEEP REBUILDING — order in, fill out, replicated</text>
  <circle cx="688" cy="20" r="3.5" fill="#00e59b"/>
  <text class="leg" x="696" y="24">order</text>
  <circle cx="758" cy="20" r="3.5" fill="#f0b429"/>
  <text class="leg" x="766" y="24">fill</text>

  <line x1="36" y1="42" x2="844" y2="42" stroke="#30363d" stroke-width="1.5"/>
  <polyline points="836,38 844,42 836,46" fill="none" stroke="#00e59b" stroke-width="1.5"/>
  <line x1="87" y1="42" x2="87" y2="54" stroke="#30363d"/>
  <line x1="263" y1="42" x2="263" y2="54" stroke="#30363d"/>
  <line x1="453" y1="42" x2="453" y2="54" stroke="#30363d"/>
  <line x1="643" y1="42" x2="643" y2="54" stroke="#30363d"/>
  <line x1="806" y1="42" x2="806" y2="54" stroke="#30363d"/>

  <g class="smi" transform="translate(48,42)">
    <rect y="-3" width="22" height="6" rx="2" x="-22" fill="url(#fwd)">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M0 0 h760" begin="0s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="3.6s" repeatCount="indefinite" begin="0s"/>
    </rect>
    <rect y="-3" width="16" height="6" rx="2" x="-16" fill="url(#fwd)">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M0 0 h760" begin="-0.7s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="3.6s" repeatCount="indefinite" begin="-0.7s"/>
    </rect>
    <rect y="-2.5" width="20" height="5" rx="2" x="-20" fill="url(#fwd)">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M0 0 h760" begin="-1.5s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="3.6s" repeatCount="indefinite" begin="-1.5s"/>
    </rect>
    <rect y="-2" width="12" height="4" rx="1.5" x="-12" fill="#7ee2b8">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M0 0 h760" begin="-2.4s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="3.6s" repeatCount="indefinite" begin="-2.4s"/>
    </rect>
  </g>

  <g transform="translate(16,54)">
    <rect class="box" width="142" height="102" rx="9"/>
    <text class="t" x="14" y="26">clients</text>
    <text class="s" x="14" y="48">binary wire protocol</text>
    <text class="s" x="14" y="64">New · Cancel · Replace</text>
  </g>
  <g transform="translate(178,54)">
    <rect class="box" width="170" height="102" rx="9"/>
    <text class="t" x="14" y="26">gateway</text>
    <text class="s" x="14" y="48">epoll / io_uring</text>
    <text class="s" x="14" y="64">busy-poll, batched send</text>
    <circle class="ev e0" cx="62" cy="84" r="4"/>
    <circle class="ev e1" cx="85" cy="84" r="4"/>
    <circle class="ev e2" cx="108" cy="84" r="4"/>
  </g>
  <g transform="translate(368,54)">
    <rect class="box" width="170" height="102" rx="9"/>
    <text class="t" x="14" y="26">SPSC rings</text>
    <text class="s" x="14" y="48">cache-line aligned</text>
    <text class="s" x="14" y="64">head / tail atomics</text>
    <g transform="translate(22,76)">
      <rect class="slot s0" width="16" height="10" rx="2"/>
      <rect class="slot s1" x="20" width="16" height="10" rx="2"/>
      <rect class="slot s2" x="40" width="16" height="10" rx="2"/>
      <rect class="slot s3" x="60" width="16" height="10" rx="2"/>
      <rect class="slot s4" x="80" width="16" height="10" rx="2"/>
      <rect class="slot s5" x="100" width="16" height="10" rx="2"/>
    </g>
  </g>
  <g transform="translate(558,54)">
    <rect class="hot" width="170" height="102" rx="9"/>
    <text class="t" x="14" y="26" fill="#00e59b">engine × N</text>
    <text class="s" x="14" y="48">pinned core, FIFO book</text>
    <text class="s" x="14" y="64">pre-sized pools</text>
    <g transform="translate(28,76)">
      <rect class="core c0" width="22" height="10" rx="2"/>
      <rect class="core c1" x="28" width="22" height="10" rx="2"/>
      <rect class="core c2" x="56" width="22" height="10" rx="2"/>
      <rect class="core c3" x="84" width="22" height="10" rx="2"/>
    </g>
  </g>
  <g transform="translate(748,54)">
    <rect class="box" width="116" height="102" rx="9"/>
    <text class="t" x="12" y="26">libvsr</text>
    <text class="s" x="12" y="48">Viewstamped</text>
    <text class="s" x="12" y="64">Replication</text>
    <circle class="ring" cx="58" cy="84" r="5" fill="none" stroke="#00e59b" stroke-width="1.2"/>
    <circle class="vs" cx="58" cy="84" r="3.5"/>
  </g>

  <line x1="36" y1="174" x2="844" y2="174" stroke="#3a3324" stroke-width="1.5"/>
  <polyline points="44,170 36,174 44,178" fill="none" stroke="#f0b429" stroke-width="1.5"/>
  <g class="smi" transform="translate(820,174)">
    <rect y="-2.5" width="18" height="5" rx="2" fill="url(#back)">
      <animateMotion dur="4.4s" repeatCount="indefinite" path="M0 0 h-760" begin="0s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="4.4s" repeatCount="indefinite" begin="0s"/>
    </rect>
    <rect y="-2" width="12" height="4" rx="1.5" fill="#f0b429">
      <animateMotion dur="4.4s" repeatCount="indefinite" path="M0 0 h-760" begin="-2.1s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="4.4s" repeatCount="indefinite" begin="-2.1s"/>
    </rect>
  </g>

  <text class="s" x="24" y="204">clients → gateway → SPSC → engine → libvsr. Each box is code in modern_exchng_cpp + libvsr.</text>
</svg>
