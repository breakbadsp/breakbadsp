<svg xmlns="http://www.w3.org/2000/svg" width="440" height="48" viewBox="0 0 440 48" role="img" aria-label="">
  <title>K-way merge over mmap</title>
  <style>
    .bg{fill:#161b22;stroke:#30363d}
    .t{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6edf3;letter-spacing:.6px}
    .doc{fill:#21262d;stroke:#30363d}
    .tape{fill:none;stroke:#00e59b;stroke-width:2;stroke-linecap:round}
    @media (prefers-reduced-motion:no-preference){
      .doc{animation:pop 2.4s ease-in-out infinite}
      .d1{animation-delay:-.4s}.d2{animation-delay:-.8s}.d3{animation-delay:-1.2s}
      .tape{stroke-dasharray:5 7;animation:march 1.4s linear infinite}
    }
    @keyframes pop{0%,100%{stroke:#30363d;fill:#21262d}40%,55%{stroke:#00e59b;fill:#0f2a20}}
    @keyframes march{to{stroke-dashoffset:-24}}
  </style>
  <rect class="bg" width="440" height="48" rx="8"/>
  <circle cx="16" cy="24" r="3.5" fill="#00e59b"/>
  <text class="t" x="28" y="28">K-WAY MERGE · MMAP</text>
  <rect class="doc d0" x="248" y="12" width="14" height="24" rx="2"/>
  <rect class="doc d1" x="268" y="15" width="14" height="24" rx="2"/>
  <rect class="doc d2" x="288" y="11" width="14" height="24" rx="2"/>
  <rect class="doc d3" x="308" y="16" width="14" height="24" rx="2"/>
  <path class="tape" d="M330 24 H360 L372 16 H424"/>
</svg>
