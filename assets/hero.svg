<svg xmlns="http://www.w3.org/2000/svg" width="880" height="292" viewBox="0 0 880 292" role="img" aria-label="Sachin Pandhare, low-latency high-throughput trading systems. Depth ladder is illustrative, not a market.">
  <title>Sachin Pandhare — low-latency, high-throughput trading systems</title>
  <style>
    .bg{fill:#0d1117}
    .name{font:700 40px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6edf3}
    .sub{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"Liberation Sans",sans-serif;fill:#9be9c8}
    .eye{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#8b949e;letter-spacing:1.6px}
    .chip{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#7ee2b8}
    .h{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#8b949e;letter-spacing:1.4px}
    .col{font:500 10px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#6e7681}
    .px{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .ask{fill:#ffb4af}
    .bid{fill:#7ee2b8}
    .foot{font:500 10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"Liberation Sans",sans-serif;fill:#6e7681}
    .pill{font:700 9px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#f0b429;letter-spacing:.6px}
    .demo{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#f0b429;letter-spacing:1.5px}
    .rule{stroke:#00e59b;stroke-width:2;stroke-linecap:round;fill:none;stroke-dasharray:200;stroke-dashoffset:0}
    .dot{fill:#00e59b}
    .pb{opacity:0}
    .abar,.bbar{height:7px;rx:2}
    @media (prefers-reduced-motion:no-preference){
      .dot{animation:pulse 2.4s ease-in-out infinite}
      .rule{animation:draw 1.35s cubic-bezier(.16,1,.3,1) both}
      .pa{animation:fa 4.8s linear infinite}
      .pb{animation:fb 4.8s linear infinite}
      .a1{animation:aw1 2.6s ease-in-out infinite alternate}
      .a2{animation:aw2 3.3s ease-in-out infinite alternate}
      .a3{animation:aw3 2.9s ease-in-out infinite alternate}
      .a4{animation:aw4 3.6s ease-in-out infinite alternate}
      .b1{animation:bw1 2.8s ease-in-out infinite alternate}
      .b2{animation:bw2 3.4s ease-in-out infinite alternate}
      .b3{animation:bw3 2.5s ease-in-out infinite alternate}
      .b4{animation:bw4 3.1s ease-in-out infinite alternate}
    }
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
    @keyframes draw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
    @keyframes fa{0%,48%{opacity:1}52%,98%{opacity:0}100%{opacity:1}}
    @keyframes fb{0%,48%{opacity:0}52%,98%{opacity:1}100%{opacity:0}}
    @keyframes aw1{from{width:46px;x:302px}to{width:104px;x:244px}}
    @keyframes aw2{from{width:34px;x:314px}to{width:72px;x:276px}}
    @keyframes aw3{from{width:40px;x:308px}to{width:90px;x:258px}}
    @keyframes aw4{from{width:28px;x:320px}to{width:58px;x:290px}}
    @keyframes bw1{from{width:42px}to{width:96px}}
    @keyframes bw2{from{width:30px}to{width:64px}}
    @keyframes bw3{from{width:50px}to{width:112px}}
    @keyframes bw4{from{width:36px}to{width:78px}}
  </style>
  <defs>
    <radialGradient id="glow" cx="200" cy="140" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c3d2c" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0c3d2c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".9" fill="#1a3d30"/>
    </pattern>
  </defs>
  <rect class="bg" width="880" height="292" rx="12"/>
  <rect width="880" height="292" fill="url(#glow)"/>
  <rect width="880" height="292" fill="url(#dots)"/>

  <circle class="dot" cx="28" cy="78" r="4"/>
  <text class="eye" x="42" y="82">TRADING INFRASTRUCTURE</text>
  <text class="name" x="24" y="132">Sachin Pandhare</text>
  <path class="rule" d="M24 150 H210"/>
  <text class="sub" x="24" y="180">low-latency · high-throughput trading systems</text>

  <g>
    <rect x="24" y="204" width="158" height="28" rx="14" fill="#0f2a20" stroke="#145c40"/>
    <text class="chip" x="103" y="222" text-anchor="middle">matching engines</text>
    <rect x="192" y="204" width="118" height="28" rx="14" fill="#0f2a20" stroke="#145c40"/>
    <text class="chip" x="251" y="222" text-anchor="middle">SPSC rings</text>
    <rect x="320" y="204" width="128" height="28" rx="14" fill="#0f2a20" stroke="#145c40"/>
    <text class="chip" x="384" y="222" text-anchor="middle">pinned cores</text>
  </g>

  <g transform="translate(492,16)">
    <rect width="368" height="260" rx="10" fill="#161b22" stroke="#30363d"/>
    <text class="h" x="16" y="26">DEPTH LADDER</text>
    <rect x="262" y="12" width="90" height="16" rx="8" fill="#2a220f" stroke="#6b5420"/>
    <text class="pill" x="307" y="23" text-anchor="middle">ILLUSTRATIVE</text>

    <text class="col" x="16" y="48">SIZE</text>
    <text class="col" x="182" y="48" text-anchor="middle">PRICE</text>
    <text class="col" x="348" y="48" text-anchor="end">SIZE</text>
    <line x1="16" y1="56" x2="348" y2="56" stroke="#21262d"/>

    <!-- asks: right-aligned size bars, prices tick between two sorted books -->
    <rect class="abar a1" x="244" y="64" width="104" height="7" rx="2" fill="#ff7b72" opacity=".9"/>
    <rect class="abar a2" x="276" y="82" width="72" height="7" rx="2" fill="#ff7b72" opacity=".75"/>
    <rect class="abar a3" x="258" y="100" width="90" height="7" rx="2" fill="#ff7b72" opacity=".85"/>
    <rect class="abar a4" x="290" y="118" width="58" height="7" rx="2" fill="#ff7b72" opacity=".7"/>

    <g class="px ask">
      <text class="pa" x="182" y="72" text-anchor="middle">100.04</text>
      <text class="pb" x="182" y="72" text-anchor="middle">100.06</text>
      <text class="pa" x="182" y="90" text-anchor="middle">100.03</text>
      <text class="pb" x="182" y="90" text-anchor="middle">100.04</text>
      <text class="pa" x="182" y="108" text-anchor="middle">100.02</text>
      <text class="pb" x="182" y="108" text-anchor="middle">100.03</text>
      <text class="pa" x="182" y="126" text-anchor="middle">100.01</text>
      <text class="pb" x="182" y="126" text-anchor="middle">100.02</text>
    </g>

    <line x1="16" y1="142" x2="150" y2="142" stroke="#30363d" stroke-dasharray="3 4"/>
    <text class="demo" x="182" y="146" text-anchor="middle">DEMO</text>
    <line x1="214" y1="142" x2="348" y2="142" stroke="#30363d" stroke-dasharray="3 4"/>

    <rect class="bbar b1" x="16" y="156" width="96" height="7" rx="2" fill="#00e59b" opacity=".9"/>
    <rect class="bbar b2" x="16" y="174" width="64" height="7" rx="2" fill="#00e59b" opacity=".75"/>
    <rect class="bbar b3" x="16" y="192" width="112" height="7" rx="2" fill="#00e59b" opacity=".95"/>
    <rect class="bbar b4" x="16" y="210" width="78" height="7" rx="2" fill="#00e59b" opacity=".8"/>

    <g class="px bid">
      <text x="182" y="164" text-anchor="middle">99.99</text>
      <text class="pa" x="182" y="182" text-anchor="middle">99.98</text>
      <text class="pb" x="182" y="182" text-anchor="middle">99.97</text>
      <text class="pa" x="182" y="200" text-anchor="middle">99.97</text>
      <text class="pb" x="182" y="200" text-anchor="middle">99.95</text>
      <text class="pa" x="182" y="218" text-anchor="middle">99.96</text>
      <text class="pb" x="182" y="218" text-anchor="middle">99.94</text>
    </g>

    <text class="foot" x="182" y="248" text-anchor="middle">decorative prices · not a market</text>
  </g>
</svg>
